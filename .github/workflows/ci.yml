name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    name: Syntax and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Check Python syntax
        # CHARMM-GUI fixture scripts are input data and include legacy Python 2.
        run: python -m compileall -q -x '/tests/test_data/' abfe .github/scripts
      - name: Build distribution
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel and verify package resources
        run: |
          python -m venv "$RUNNER_TEMP/abflow-package"
          "$RUNNER_TEMP/abflow-package/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/abflow-package/bin/python" -I .github/scripts/check_package.py
